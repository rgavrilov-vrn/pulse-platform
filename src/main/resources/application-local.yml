# application-local.yml
# Только overrides поверх base.
# Активируется: --spring.profiles.active=local (или SPRING_PROFILES_ACTIVE=local).
#
# ВАЖНО: в base удалён spring.profiles.default=local (FIX #32).
# Без явного профиля приложение стартует в production-режиме и упадёт
# на отсутствии JWT_SECRET / GOODWAN_USERNAME — это ожидаемо.

spring:
  jpa:
    show-sql: true
  output:
    ansi:
      enabled: always
  kafka:
    listener:
      # Kafka в local не поднята.
      auto-startup: false

app:
  kafka:
    enabled: false
  outbox:
    relay-enabled: false
  security:
    jwt:
      # FIX #33: единственное место с dev-секретом. В production
      # задаётся через JWT_SECRET в окружении.
      secret: test-secret-test-secret-test-secret-test-secret

# FIX: в base goodwan.username/password теперь без дефолта (fail-fast).
# В local sync отключён, но @ConfigurationProperties всё равно биндится →
# нужны явные значения, иначе placeholder не разрешится на старте.
goodwan:
  username: dev-not-configured
  password: dev-not-configured
  sync:
    enabled: false

logging:
  # FIX #34: SQL-логи — только в local.
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.http.converter.json: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%t] %clr(%logger{36}){cyan} : %m%n%wEx"