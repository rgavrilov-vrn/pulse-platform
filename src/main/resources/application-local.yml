# application-local.yml
# Только overrides поверх application.yml.
# Всё, что совпадает с application.yml (datasource, kafka, goodwan, server.*),
# здесь НЕ дублируется — Spring Boot мержит профили поверх base.

spring:
  jpa:
    show-sql: true
  output:
    ansi:
      enabled: always

logging:
  # В base (application.yml) SQL-логи выключены (INFO) — включаем только в local.
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%t] %clr(%logger{36}){cyan} : %m%n%wEx"