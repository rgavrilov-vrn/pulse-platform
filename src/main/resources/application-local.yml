spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pulse_platform
    username: pulse_platform_app
    password: password@pulse.ru
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    show-sql: true
logging:
  level:
    root: INFO
    ru.agroeco.pulse.platform: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%thread] %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /pulse-platform
    
goodwan:
  base-url: https://my.goodwan.ru/api
  username: ${GOODWAN_USERNAME}
  password: ${GOODWAN_PASSWORD}
  sync:
    enabled: true
    interval: PT1M
    page-size: 1000
  devices:
    - 9441