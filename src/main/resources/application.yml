spring:
  application:
    name: pulse-platform
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse_platform}
    username: ${DB_USERNAME:pulse_platform_app}
    password: ${DB_PASSWORD:password@pulse.ru}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pulse-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.agroeco.pulse.*"
  main:
    web-application-type: servlet
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /pulse-platform


app:
  kafka:
    enabled: true
    topic:
      video-events: pulse.videoserver.events
      incident-events: pulse.incident.events
      notification-requests: pulse.notification.requests
      notification-status: pulse.notification.status
  outbox:
    relay-enabled: true
    batch-size: 50
    max-attempts: 5
    relay-interval-ms: 5000
    default-topic: pulse.events
    event-topics:
      VideoEventNormalized: ${app.kafka.topic.video-events}
      IncidentCreated:      ${app.kafka.topic.incident-events}
      IncidentAssigned:     ${app.kafka.topic.incident-events}
      IncidentConfirmed:    ${app.kafka.topic.incident-events}
      IncidentRejected:     ${app.kafka.topic.incident-events}
      IncidentClosed:       ${app.kafka.topic.incident-events}
      NotificationRequested: ${app.kafka.topic.notification-requests}
      NotificationStatus:    ${app.kafka.topic.notification-status}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: ${JWT_ISSUER:pulse-platform}
      audience: ${JWT_AUDIENCE:pulse-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ru.agroeco.pulse.platform: DEBUG
    ru.agroeco.pulse.goodwan: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%thread] %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8

goodwan:
  base-url: https://my.goodwan.ru/api
  username: ${GOODWAN_USERNAME}
  password: ${GOODWAN_PASSWORD}
  sync:
    enabled: true
    interval: PT1M
    page-size: 1000
  devices:
    - 9441
