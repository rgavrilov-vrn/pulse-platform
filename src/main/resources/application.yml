spring:
  application:
    name: pulse-platform
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse_platform}
    username: ${DB_USERNAME:pulse_platform_app}
    password: ${DB_PASSWORD:password@pulse.ru}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: pulse-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.agroeco.pulse.platform.*"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /pulse-platform

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic:
      incident-events: pulse.platform.incident-events
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    batch-size: 50
    max-attempts: 5
    poll-delay-ms: 5000
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    bootstrap:
      enabled: ${SECURITY_BOOTSTRAP_ENABLED:false}
      username: ${SECURITY_BOOTSTRAP_USERNAME}
      password: ${SECURITY_BOOTSTRAP_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ru.agroeco.pulse.platform: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%thread] %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8

