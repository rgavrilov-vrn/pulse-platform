# application.yml
# Base-конфиг. Рассчитан на production: все секреты и окружение — через env.
# Профиль local активируется явно: --spring.profiles.active=local
# (FIX #32: удалён spring.profiles.default=local — иначе прод мог тихо
#  стартовать в local-режиме с отключённой Kafka и debug-логами).

spring:
  application:
    name: pulse-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulse_platform}
    username: ${DB_USERNAME:pulse_platform_app}
    password: ${DB_PASSWORD:password@pulse.ru}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # FIX: чистое создание БД с нуля — baseline не нужен.
    # (baseline-on-migrate=true маскирует пропущенные миграции.)
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: pulse-platform
      # FIX #35: earliest — dev-дефолт, при первом запуске consumer group
      # вычитывает весь backlog топика. Для production — latest.
      auto-offset-reset: latest
      # FIX #11, #38: VideoEventNormalizedConsumer принимает `String payload`
      # и парсит вручную через ObjectMapper. JsonDeserializer вернул бы
      # LinkedHashMap → MessageConversionException. Убран также
      # spring.json.trusted.packages (больше не нужен).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /pulse-platform

# FIX #36: spring.main.web-application-type: servlet — избыточно
# (deduce и так вернёт SERVLET при наличии spring-boot-starter-webmvc).

app:
  kafka:
    enabled: true
    topic:
      video-events: pulse.videoserver.events
      incident-events: pulse.incident.events
      # notification-requests / notification-status удалены:
      # модуля уведомлений в коде нет (FIX #13).

  outbox:
    relay-enabled: true
    batch-size: 50
    max-attempts: 5
    relay-interval-ms: 5000
    default-topic: pulse.events
    # FIX #12, #13: ключи должны точно совпадать с DomainEvent.outboxEventType().
    #   * IncidentCreated — override → "IncidentCreated" (PascalCase);
    #   * остальные — DomainEventType.getValue() (UPPER_SNAKE_CASE).
    # Убраны несуществующие: IncidentAssigned / IncidentConfirmed /
    # IncidentRejected / IncidentClosed / VideoEventNormalized /
    # NotificationRequested / NotificationStatus.
    #
    # Рекомендация: удалить override в IncidentCreated.outboxEventType(),
    # чтобы ВСЕ ключи стали UPPER_SNAKE_CASE (INCIDENT_CREATED).
    event-topics:
      IncidentCreated:               ${app.kafka.topic.incident-events}
      INCIDENT_STATUS_CHANGED:       ${app.kafka.topic.incident-events}
      INCIDENT_COMMENT_ADDED:        ${app.kafka.topic.incident-events}
      INCIDENT_UPDATED:              ${app.kafka.topic.incident-events}
      INCIDENT_CHECKPOINT_ADDED:     ${app.kafka.topic.incident-events}
      INCIDENT_CHECKPOINT_REMOVED:   ${app.kafka.topic.incident-events}
      INCIDENT_MATERIAL_UPLOADED:    ${app.kafka.topic.incident-events}
      INCIDENT_MATERIAL_DELETED:     ${app.kafka.topic.incident-events}
      INCIDENT_MATERIAL_DOWNLOADED:  ${app.kafka.topic.incident-events}
      VIDEO_EVENT_INGESTED:          ${app.kafka.topic.video-events}

  cors:
    # FIX #39: убран YAML-дефис. Spring Boot разбивает скаляр по запятой
    # в List<String> автоматически; с дефисом получался список из ОДНОГО
    # элемента — "http://localhost:5173,http://..." (CORS preflight падал).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}

  security:
    jwt:
      # FIX #33: секрет БЕЗ дефолта — fail-fast, если JWT_SECRET не задан.
      # Для local — см. application-local.yml.
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: ${JWT_ISSUER:pulse-platform}
      audience: ${JWT_AUDIENCE:pulse-api}
  auth:
    role-assignment:
      # FIX #22: выдача этих ролей требует authority system:admin.
      # Иначе любой с user:assign_role мог выдать себе/другу SUPERUSER.
      protected-roles:
        - SUPERUSER
        - ADMIN
      protected-role-authority: system:admin

management:
  endpoints:
    web:
      exposure:
        # metrics убран: Prometheus скрейпит /actuator/prometheus, а /actuator/metrics
        # требует system:admin — для ручной отладки достаточно prometheus.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ru.agroeco.pulse: DEBUG
    # FIX #34: org.hibernate.SQL=DEBUG и orm.jdbc.bind=TRACE удалены из base —
    # это утечка SQL-параметров (включая password_hash при логине).
    # Включаются только в application-local.yml.
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} --- [%t] %clr(%logger{36}){cyan} : %m%n%wEx"
#  console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%thread] %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8

goodwan:
  base-url: ${GOODWAN_BASE_URL:https://my.goodwan.ru/api}
  # FIX: без дефолта — fail-fast, если в проде не задан GOODWAN_USERNAME.
  # В local профиле переопределяется на dev-not-configured.
  username: ${GOODWAN_USERNAME}
  password: ${GOODWAN_PASSWORD}
  sync:
    enabled: true
    interval: PT1M
    page-size: 1000
  devices:
    - 9441