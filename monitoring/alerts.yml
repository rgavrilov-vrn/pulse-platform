groups:
  - name: trassir
    rules:
      - alert: TrassirIngestFailureRateHigh
        expr: |
          sum(rate(trassir_ingest_total{result="failed"}[5m]))
          /
          sum(rate(trassir_ingest_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TRASSIR ingest failure rate is high"
          description: "More than 5% of ingest requests failed during the last 5 minutes."

      - alert: TrassirEventFailureRateHigh
        expr: |
          sum(rate(trassir_events_failed_total[5m]))
          /
          sum(rate(trassir_events_processed_total[5m]) + rate(trassir_events_failed_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TRASSIR event failure rate is high"
          description: "More than 5% of processed events failed during the last 5 minutes."

      - alert: TrassirDeadLetterEventsGrowing
        expr: |
          increase(trassir_events_dead_letter_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TRASSIR dead-letter events are growing"
          description: "Events exhausted all retry attempts during the last 15 minutes."

      - alert: TrassirIngestLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(trassir_ingest_duration_seconds_bucket[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TRASSIR ingest latency is high"
          description: "95th percentile ingest latency exceeded 2 seconds."
